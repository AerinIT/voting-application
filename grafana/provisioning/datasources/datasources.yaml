apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "^.*?traceI[d|D]=(\\w+).*$"
          name: traceId
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: "Mimir"
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: false
        spanEndTimeShift: "500ms"
        spanStartTimeShift: "-500ms"
        tags: ["votingdb"]

  - name: Mimir
    type: prometheus
    access: proxy
    uid: mimir
    url: http://mimir:9009/prometheus
    jsonData:
      exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: traceID
      httpMethod: POST
      timeInterval: "2s"


  - name: 
    type: loki
    access: proxy
    url: 
    basicAuth: true
    basicAuthUser: 
    jsonData:
      maxLines: 1000
    secureJsonData:
      basicAuthPassword: 
    version: 1


  - name: 
    type: prometheus
    access: proxy
    url: 
    basicAuth: true
    basicAuthUser: 
    jsonData:
      timeInterval: 1s
    secureJsonData:
      basicAuthPassword: 
    version: 1






